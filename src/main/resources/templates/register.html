<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up — BillReminder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .auth-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(15, 29, 51, 0.28);
        }
        .logo-box {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background-color: #1b365d;
            color: #ffffff;
            font-size: 1.5rem;
        }
        .btn-navy {
            background-color: #1b365d;
            border-color: #1b365d;
            color: #ffffff;
            font-weight: 600;
        }
        .btn-navy:hover {
            background-color: #142947;
            color: #ffffff;
        }
    </style>
</head>
<body>
<div class="container" style="max-width: 420px;">
    <div class="card auth-card bg-white">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <span class="d-inline-flex align-items-center justify-content-center logo-box mb-3">
                    <i class="bi bi-calendar2-check"></i>
                </span>
                <h3 class="fw-bold mb-1" style="color:#1b365d;">Create Account</h3>
                <p class="text-muted small">Never miss a subscription renewal again</p>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

            <form th:action="@{/register}" th:object="${userRegistrationDTO}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Full Name <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{fullName}" class="form-control" placeholder="Your Name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Email Address <span class="text-danger">*</span></label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="you@gmail.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="password" th:field="*{password}" id="registerPassword" class="form-control" minlength="6" placeholder="Minimum 6 characters" required>
                        <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('registerPassword', 'registerEyeIcon')" aria-label="Show password">
                            <i class="bi bi-eye" id="registerEyeIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-navy w-100 py-2">Create Account</button>
            </form>

            <div class="text-center mt-4">
                <small class="text-muted">Already have an account?
                    <a th:href="@{/login}" class="fw-semibold text-decoration-none" style="color:#1b365d;">Sign in</a>
                </small>
            </div>
        </div>
    </div>
</div>

<script>
    function togglePassword(inputId, iconId) {
        const passwordInput = document.getElementById(inputId);
        const eyeIcon = document.getElementById(iconId);
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }
</script>
</body>
</html>
