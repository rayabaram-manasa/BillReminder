<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Subscription — BillReminder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .navbar-navy {
            background: #142947;
        }
        .btn-navy {
            background-color: #1b365d;
            border-color: #1b365d;
            color: #ffffff;
            font-weight: 500;
        }
        .btn-navy:hover {
            background-color: #142947;
            color: #ffffff;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark navbar-navy px-4 py-3">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/subscriptions}">
            <i class="bi bi-arrow-left-circle me-2"></i>Back to Dashboard
        </a>
    </div>
</nav>

<div class="container py-5" style="max-width: 650px;">
    <div class="card border shadow-sm rounded-4">
        <div class="card-header bg-white py-3 fw-bold border-bottom" style="color:#1b365d;">
            <i class="bi bi-pencil-square me-2"></i>Edit Subscription Details
        </div>
        <div class="card-body p-4 bg-white">
            <form th:action="@{/subscriptions/update/{id}(id=${subscriptionId})}" th:object="${subscriptionRequestDTO}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">Name <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">Category</label>
                    <input type="text" th:field="*{category}" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">Amount (₹) <span class="text-danger">*</span></label>
                    <input type="number" step="0.01" th:field="*{amount}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">Billing Cycle <span class="text-danger">*</span></label>
                    <select th:field="*{billingCycle}" class="form-select" required>
                        <option th:each="cycle : ${billingCycles}" th:value="${cycle}" th:text="${cycle}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">Next Due Date <span class="text-danger">*</span></label>
                    <input type="date" th:field="*{nextBillingDate}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">Remind Days Before <span class="text-danger">*</span></label>
                    <input type="number" th:field="*{reminderDaysBefore}" class="form-control" min="0" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">Status <span class="text-danger">*</span></label>
                    <select th:field="*{status}" class="form-select" required>
                        <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option>
                    </select>
                </div>
                <div class="col-12 d-flex justify-content-between mt-4 pt-2 border-top">
                    <a th:href="@{/subscriptions}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-navy px-4">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
